<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}iframe{width:1280px;border:0;display:block}</style></head><body>
<iframe id="f"></iframe><script>
const p=new URLSearchParams(location.search),y=+(p.get("y")||0),h=+(p.get("h")||860),path=p.get("path")||"/",f=document.getElementById("f");
f.style.height=h+"px";document.body.style.height=h+"px";
f.addEventListener("load",()=>{try{f.contentWindow.document.documentElement.style.scrollBehavior="auto";const go=()=>f.contentWindow.scrollTo({top:y,behavior:"instant"});go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,400);}catch(e){}});
f.src=path;</script></body></html>
